name: App build (Android APK)

# Builds an UNSIGNED release APK to prove the Android project still compiles.
# Manual on purpose (it is slow); analysis and tests run in app-ci.yml on every change.
# (Moved here from app/.github/workflows/ci.yml, which GitHub ignores in a subfolder.)

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (unsigned)
        run: flutter build apk --release --no-pub
        env:
          STORE_FILE: ""
          STORE_PASSWORD: ""
          KEY_ALIAS: ""
          KEY_PASSWORD: ""
