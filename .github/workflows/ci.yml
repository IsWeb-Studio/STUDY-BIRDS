name: Backend CI

on:
  push:
    branches: [main, monorepo]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Install dependencies
        working-directory: server
        run: npm ci --prefer-offline

      - name: Lint (basic syntax check)
        working-directory: server
        run: node --check src/server.js || true

      - name: Check for secrets in code
        run: |
          if grep -rE "(sk_live|rk_live|TWILIO_AUTH_TOKEN\s*=\s*['\"][^$])" server/src/ --include="*.js"; then
            echo "Potential secret found in source code!"
            exit 1
          fi
          echo "No hardcoded secrets found."

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        working-directory: server
        run: npm audit --audit-level=high || true
